<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Temperature Converter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="converter">

    <div class="heading">
      <p class="small-title">Temperature Tool</p>
      <h1>Temperature Converter</h1>
      <p>
        Convert temperatures between Celsius, Fahrenheit, and Kelvin.
      </p>
    </div>

    <div class="converter-box">

      <div class="input-group">
        <label for="temperature">Temperature</label>
        <input
          type="number"
          id="temperature"
          placeholder="Enter temperature"
          step="any"
        >
      </div>

      <div class="input-group">
        <label for="unit">Convert from</label>

        <select id="unit">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>
      </div>

      <button id="convertBtn">Convert Temperature</button>

      <p id="errorMessage" class="error-message"></p>

      <div id="results" class="results">

        <div class="result-card">
          <span>Celsius</span>
          <strong id="celsiusResult">-- °C</strong>
        </div>

        <div class="result-card">
          <span>Fahrenheit</span>
          <strong id="fahrenheitResult">-- °F</strong>
        </div>

        <div class="result-card">
          <span>Kelvin</span>
          <strong id="kelvinResult">-- K</strong>
        </div>

      </div>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
